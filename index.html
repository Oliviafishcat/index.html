<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>6-7</h1>
    <p id="display">I built this website on GitHub.</p>

    <a href="https://youtu.be/yRkkERLPzaI?si=aalrBs3aoNdCVxJ2"> 
        <button style="background-color:red; width:20vw; height:20vw;"> Hi > </button>
    </a>

    <button onclick="playSound('.mixkit-fast-double-click-on-mouse-275.wav')" style="background-color:blue; width:20vw; height:20vw;"> 
        hello > 
    </button>

    <br><br>

    <label for="wrote">input text </label>
    <input 
        type="text" 
        id="wrote" 
        style="width:10vw;" 
        placeholder="text to display"
        maxlength="100" 
    /> 

    <br>

    <input type="submit" value="Send text" onclick="text()">

    <br><br>

    <input type="color">

    <script>
        function text() {
            let g = document.getElementById('wrote').value;
            document.getElementById('display').textContent = g;
        }

        function playSound(audioFile) {
            let audio = new Audio(audioFile);
            audio.play();
        }
    </script>

</body>
</html>
