<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <h1>6-7</h1>
    <p id="display">I built this website on GitHub.</p>

    <a href="https://youtu.be/yRkkERLPzaI?si=aalrBs3aoNdCVxJ2"> 
        <button style="background-color:red; width:100px; height: 100px; color: white;"> Hi > </button>
    </a>

    <br><br>

    <label for="wrote">Input text: </label>
    <input type="text" id="wrote" placeholder="text to display" maxlength="100"> 
    <button type="button" onclick="updateText()">Send text</button>

    <br><br>

    <button type="button" onclick="playSound('click.wav')" style="background-color:blue; width:100px; height: 100px; color: white;"> 
        Hello > 
    </button>

    <br><br>

    <label>Change Background: </label>
    <input type="color" oninput="document.body.style.backgroundColor = this.value">

    <br><br>

    
    <button type="button" onclick="document.getElementById('myImage').style.display='block'">Show Image</button>
    <button type="button" onclick="document.getElementById('myImage').style.display='none'">Hide Image</button>
<img id="myImage" src="IMG_20260205_075036.png" alt="display" style="display: none; width: 200px;">
    <script>
        function updateText() {
            let inputVal = document.getElementById('wrote').value;
            document.getElementById('display').textContent = inputVal;
        }

        function playSound(file) {
            var audio = new Audio(file);
            audio.play().catch(e => console.log("Audio file not found or blocked by browser"));
        }
    </script>

</body>
</html>
